name: BOOM - native plugins and DSP tests

# Keep only the latest CI attempt per branch while diagnosing runner queues.
concurrency:
  group: boom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  dsp-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify interactive UI parameter contract
        run: python3 Tests/ui_binding_contract.py
      - name: Verify native preset browser bindings and persistence
        run: python3 Tests/browser_native_contract.py
      - name: Verify tabbed mastering chain UI and parameter connections
        run: python3 Tests/mastering_chain_contract.py
      - name: Validate centered titles and symbol-free UTF-8 interface
        run: python3 Tests/ui_text_contract.py
      - name: Validate native chrome, A/B wiring, labels and JPEG exclusions
        run: python3 Tests/native_chrome_contract.py
      - name: Verify BOOM phase 2 typography, browser and geometry
        run: python3 Tests/ui_phase2_contract.py
      - name: Verify phase 3 focus, hover, margins and 13-inch layouts
        run: python3 Tests/ui_phase3_contract.py
      - name: Check native upper language chooser and clean ASCII display
        run: python3 Tests/upper_text_language_contract.py
      - name: Configure dependency-free DSP tests
        run: cmake -S . -B build-dsp -DBOOM_DSP_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build DSP tests
        run: cmake --build build-dsp --parallel 3
      - name: Run DSP tests
        run: ctest --test-dir build-dsp --output-on-failure

  sanitizer-dsp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure DSP sanitizer validation
        run: >-
          cmake -S . -B build-sanitize -DBOOM_DSP_ONLY=ON -DCMAKE_BUILD_TYPE=Debug
          '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer'
          '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
      - name: Build sanitized tests
        run: cmake --build build-sanitize --parallel 3
      - name: Run sanitized tests
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-sanitize --output-on-failure

  native-plugins:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            label: macOS-Universal-arm64-x86_64
          - runner: windows-2022
            label: Windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE 8.0.10 universal macOS plugin
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Configure JUCE 8.0.10 Windows plugin
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build AU / VST3 and standalone
        run: cmake --build build --config Release --parallel 3
      - name: Verify Universal AU VST3 and Standalone Mach-O architectures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for format in AU VST3 Standalone; do
            case "$format" in
              AU) bundle="build/BOOM_artefacts/Release/AU/BOOM.component" ;;
              VST3) bundle="build/BOOM_artefacts/Release/VST3/BOOM.vst3" ;;
              Standalone) bundle="build/BOOM_artefacts/Release/Standalone/BOOM.app" ;;
            esac
            binary="$bundle/Contents/MacOS/BOOM"
            if [[ ! -f "$binary" ]]; then
              echo "::error::Missing Mach-O binary: $binary"
              exit 1
            fi
            arches="$(lipo -archs "$binary")"
            echo "$format: $arches"
            if [[ " $arches " != *" arm64 "* ]] || [[ " $arches " != *" x86_64 "* ]]; then
              echo "::error::Expected universal arm64 + x86_64 binary in $binary"
              exit 1
            fi
          done
      - name: Verify Windows VST3 binary exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path "build/BOOM_artefacts/Release/VST3" -Filter "*.vst3" -Recurse -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw "BOOM VST3 artifact missing" }
      - name: Test DSP
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload unsigned development plugins
        uses: actions/upload-artifact@v4
        with:
          name: BOOM-${{ matrix.label }}-unsigned
          path: |
            build/BOOM_artefacts/Release/AU/**
            build/BOOM_artefacts/Release/VST3/**
            build/BOOM_artefacts/Release/Standalone/**
          if-no-files-found: error
          retention-days: 14
